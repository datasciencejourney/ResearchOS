# ResearchOS local stack: PostgreSQL + MCP research toolbelt + API.
#
#   docker compose up --build
#
# Then:
#   curl localhost:8000/api/v1/health
#   open http://localhost:8000/docs
#
# The API reaches the toolbelt over streamable HTTP (MCP_TRANSPORT=http) rather
# than spawning it, so the same MCP server can be shared with other clients.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: researchos
      POSTGRES_PASSWORD: researchos
      POSTGRES_DB: researchos
    ports:
      - "5432:5432"
    volumes:
      - researchos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchos -d researchos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build: .
    command: ["python", "-m", "mcp_server.server"]
    environment:
      MCP_HTTP_PORT: "8900"
    ports:
      - "8900:8900"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('127.0.0.1',8900)))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://researchos:researchos@postgres:5432/researchos
      CHECKPOINTER_DATABASE_URL: postgresql://researchos:researchos@postgres:5432/researchos
      MCP_TRANSPORT: http
      MCP_SERVER_URL: http://mcp:8900/mcp
    ports:
      - "8000:8000"
    # Apply schema migrations, then serve.
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  researchos_pgdata: